version: 2.1

jobs:
  always-run:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show always workflow output
          command: |
            echo "Always-run workflow is running."
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"

  pr-checks:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Confirm merge queue build
          command: |
            echo "Merge queue build detected. Running PR checks before merge."
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"
      - run:
          name: Show workflow output
          command: |
            echo "CircleCI merge queue PR checks are running successfully."
            echo "Add your project-specific build or test commands here."

  test-queue:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show test queue output
          command: |
            echo "Test-queue workflow is running."
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"

workflows:
  always-run:
    jobs:
      - always-run

  pull-request:
    jobs:
      - always-run

  test-queue:
    jobs:
      - test-queue

  pull-request:
    when: pipeline.git.branch starts-with "gh-readonly-queue/"
    jobs:
      - pr-checks
