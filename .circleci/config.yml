version: 2.1

jobs:
  always-run:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show always workflow output
          command: |
            echo "Always-run workflow is running."
            echo "Event name: << pipeline.event.name >>"
            echo "Event action: << pipeline.event.action >>"
            echo "PR draft: << pipeline.event.github.pull_request.draft >>"
            echo "PR label: << pipeline.event.github.label.name >>"
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"

  run-tests:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show workflow output
          command: |
            echo "CircleCI tests are running successfully."
            echo "Add your project-specific build or test commands here."

  test-queue:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show test queue output
          command: |
            echo "Test-queue workflow is running."
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"

workflows:
  always-run:
    jobs:
      - always-run

  test-queue:
    jobs:
      - test-queue

  test-and-validate:
    when:
      and:
        - equal: [ "pull_request", << pipeline.event.name >> ]
        - or:
            # Opened (draft or ready): always run when the PR is created.
            - equal: [ "opened", << pipeline.event.action >> ]
            # Any push while the PR is not a draft.
            - and:
                - equal: [ "synchronize", << pipeline.event.action >> ]
                - equal: [ false, << pipeline.event.github.pull_request.draft >> ]
            # Draft changed to ready for review.
            - equal: [ "ready_for_review", << pipeline.event.action >> ]
            # Manual escape hatch: run when the run-ci label is added.
            - and:
                - equal: [ "labeled", << pipeline.event.action >> ]
                - equal: [ "run-ci", << pipeline.event.github.label.name >> ]
    jobs:
      - run-tests
