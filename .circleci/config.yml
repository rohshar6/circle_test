version: 2.1

jobs:
  pr-checks:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Confirm pull request build
          command: |
            if [ -z "$CIRCLE_PULL_REQUEST" ] && [ -z "$CIRCLE_PULL_REQUESTS" ]; then
              echo "This workflow is intended to run only for pull requests."
              exit 1
            fi

            echo "Pull request build detected."
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"
            echo "Pull request: ${CIRCLE_PULL_REQUEST:-$CIRCLE_PULL_REQUESTS}"
      - run:
          name: Show workflow output
          command: |
            echo "CircleCI PR workflow is running successfully."
            echo "Add your project-specific build or test commands here."

workflows:
  pull-request:
    jobs:
      - pr-checks:
          filters:
            branches:
              ignore:
                - main
                - master
