version: 2.1

jobs:
  always-run:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show always workflow output
          command: |
            echo "Always-run workflow is running."
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"

  run-tests:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show test context
          command: |
            echo "Test-and-validate workflow is running."
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"
      - run:
          name: Show workflow output
          command: |
            echo "CircleCI tests are running successfully."
            echo "Add your project-specific build or test commands here."

  test-queue:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Show test queue output
          command: |
            echo "Test-queue workflow is running."
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Commit: ${CIRCLE_SHA1}"

workflows:
  always-run:
    jobs:
      - always-run

  test-queue:
    jobs:
      - test-queue

  test-and-validate:
    jobs:
      - run-tests:
          filters:
            branches:
              only:
                - main
                - /pull\/.*/
                - /gh-readonly-queue\/.*/ # GitHub merge queue branches
